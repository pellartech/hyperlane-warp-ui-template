version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node -v
        - corepack enable
        - corepack prepare pnpm@11.1.3 --activate
        # Standard Amplify build instance = 8 GiB RAM; reserve ~1.5 GiB for the OS.
        - export NODE_OPTIONS="--max-old-space-size=14000"
        - export CI=true
        - pnpm install --frozen-lockfile
    build:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=14000"
        - export CI=true
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      # Omit .next/cache on first deploy — re-add after a successful build if needed.
