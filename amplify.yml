version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node -v
        - corepack enable
        - corepack prepare pnpm@11.1.3 --activate
        # Standard = 8 GiB → use 6144. Large = 16 GiB → use 14000.
        # Match NODE_OPTIONS to your Amplify build instance (App settings → Build settings → Advanced).
        - export NODE_OPTIONS="--max-old-space-size=6144"
        - export CI=true
        - pnpm install --frozen-lockfile
    build:
      commands:
        - export NODE_OPTIONS="--max-old-space-size=6144"
        - export CI=true
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
